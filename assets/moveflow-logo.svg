<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Studio MoveFlow</title>
  <desc id="desc">Emblema circular preto com Move em branco, Flow em turquesa e as inscrições Studio e Treinamento e Reabilitação.</desc>
  <circle cx="120" cy="120" r="112" fill="#080c0f" stroke="#fff" stroke-width="3"/>
  <text x="120" y="67" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="7" text-anchor="middle">STUDIO</text>
  <text x="30" y="126" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-style="italic" font-weight="700">Move</text>
  <text x="115" y="126" fill="#20d4cb" font-family="cursive" font-size="52" font-style="italic" font-weight="700">Flow</text>
  <text x="120" y="166" fill="#fff" font-family="Arial, sans-serif" font-size="7" font-weight="700" letter-spacing="1.6" text-anchor="middle">TREINAMENTO E REABILITAÇÃO</text>
</svg>